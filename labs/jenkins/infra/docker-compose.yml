# Proje adi acikca veriliyor: iki lab da 'infra' klasorunde durdugu icin
# Compose ikisine de ayni varsayilan proje adini verir ve lablar
# birbirinin container/volume'larini ele gecirir.
name: devsecops-jenkins

# Jenkins + yerel Git sunucusu (Gitea).
#
# 'image' VE 'build' birlikte tanimli:
#   docker compose up -d        -> GHCR'daki hazir imaji ceker (hizli)
#   docker compose build        -> imaj yoksa/erisilemiyorsa yerelde derler
# Boylece GHCR erisimi olmayan ortamda da lab calisir.

services:

  gitea:
    image: ghcr.io/yasinoz/gitea/gitea:28.2.0
    environment:
      # Kurulum sihirbazini atla - lab ortaminda elle kurulum adimi istemiyoruz
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__server__DOMAIN: localhost
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      # Webhook hedefi Jenkins, konteyner aginda ozel IP'de: "private" bunu kapsar.
      # NOT: eski [webhook] bolumu v28 ile kaldirildi, "*" artik gecersiz deger.
      GITEA__security__ALLOWED_HOST_LIST: "private"
    ports:
      - "3000:3000"

  jenkins:
    image: ghcr.io/yasinoz/labs-jenkins:1.0.2
    build:
      context: ../../../images/jenkins
    ports:
      - "8080:8080"
    environment:
      # Kurulum sihirbazini atla; kullanici ve isler casc.yaml'dan gelir
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      # /var/jenkins_home VOLUME oldugu icin yapilandirma onun disinda
      # tutulur - yoksa imaj guncellense de eski kopya okunurdu
      CASC_JENKINS_CONFIG: /var/jenkins_config/casc.yaml
    # BILINCLI LAB TAVIZI: Jenkins root olarak calisiyor.
    #
    # Pipeline'lar host Docker motorunda imaj derliyor ve docker.sock'un
    # sahipligi host'a gore degisiyor (Docker Desktop'ta root:root, Linux'ta
    # root:docker ve degisken grup kimligi). Root olarak calistirmak her
    # ortamda calisan tek secenek.
    #
    # Uretimde bu KABUL EDILEMEZ: socket'e erisebilen container host'u ele
    # gecirebilir. 'Container guvenlik kontrolleri' labi bu konuyu isliyor.
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
