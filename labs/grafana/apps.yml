# NOT: courselabs/fulfilment-* imajlari digest ile pinlendi.
# Docker Hub'da '25.03' diye bir etiket YOK - yalnizca
# '25.03-linux-amd64' var, yani Apple Silicon ogrencilerde cekilemezdi.
# Cok mimarili olan tek surum 'latest'; tekrar edilebilirlik icin onun
# digest'ine sabitlendi (digest hem amd64 hem arm64'u kapsar).
services:

  node-exporter:
    image: ghcr.io/yasinoz/prom/node-exporter:v1.9.1
    networks: 
      - metrics

  fulfilment-api:
    image: ghcr.io/yasinoz/courselabs/fulfilment-api:sha-ee65224fb578
    ports:
      - 8080:80
    networks: 
      - fulfilment
      - metrics

  fulfilment-processor-1:
    image: ghcr.io/yasinoz/courselabs/fulfilment-processor:sha-578bc38424a1
    environment:
      - Observability__Metrics__IncludeRuntime=true
      - Observability__StartupDelaySeconds=20
      - Observability__ExitAfterSeconds=90
    restart: always
    networks: 
      - fulfilment
      - metrics

  fulfilment-processor-2:
    image: ghcr.io/yasinoz/courselabs/fulfilment-processor:sha-578bc38424a1
    environment:
      - Observability__Metrics__IncludeRuntime=true
      - Observability__Metrics__Factor=3
    networks: 
      - fulfilment
      - metrics

  fulfilment-processor-3:
    image: ghcr.io/yasinoz/courselabs/fulfilment-processor:sha-578bc38424a1
    environment:
      - Observability__Metrics__IncludeRuntime=true
      - Observability__Metrics__Factor=0.5
      - Observability__Metrics__FailureFactor=0.3
      - Observability__Metrics__AppVersion=1.5.2
    networks: 
      - fulfilment
      - metrics

networks: 
  fulfilment:
  metrics:
    name: metrics
