services:

  prometheus:
    image: prom/prometheus:v3.15.0
    ports: 
      - 9090:9090
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - metrics

  grafana:
    image: grafana/grafana:13.2.4
    ports: 
      - 3000:3000
    networks:
      - metrics

networks: 
  metrics:
    name: metrics