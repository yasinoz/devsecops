apiVersion: v1
kind: Service
metadata:
  name: pi-np
  labels:
    kubernetes.courselabs.co: container-security
spec:
  selector:
    app: pi-web
  ports:
    - name: http
      port: 8020
      # Adlandirilmis port: Deployment'ta 'http' diye isimlendirilen porta
      # gider. fix-4 uygulamayi 80'den 5001'e tasiyor; sayi sabitlenseydi
      # Service bos bir porta trafik gonderip site olurdu.
      targetPort: http
      nodePort: 30020
  type: NodePort
