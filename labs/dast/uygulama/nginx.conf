# Siparis portalinin "bugunku" hali.
#
# Bu dosyada kasitli olarak eksik birakilmis sey yok - gercek hayatta
# nginx yapilandirmalari tam olarak boyle basliyor: calisiyor, istek
# cevapliyor, kimse baska bir sey eklemiyor. Guvenlik basliklari ve
# cerez bayraklari "sonra" diye birakiliyor.
#
# DAST labinda once bunu tariyoruz, sonra nginx.guvenli.conf ile
# karsilastiriyoruz.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
    }

    # Oturum acma. Cerez hicbir bayrak tasimiyor.
    location /giris {
        add_header Set-Cookie "oturum=s3cr3t-oturum-kimligi; Path=/";
        default_type text/html;
        return 200 "<html><body><h1>Giris yapildi</h1><a href=\"/\">Ana sayfa</a></body></html>";
    }
}
