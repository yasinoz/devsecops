# Guvenlik basliklari - TEK KAYNAK.
#
# NEDEN AYRI DOSYA: nginx'te bir 'location' blogunda add_header
# kullanirsaniz, o blok ust seviyedeki add_header satirlarinin
# TAMAMINI kaybeder. Miras yoktur - ya hepsi oradadir ya hicbiri.
#
# Bu yuzden basliklari bir dosyada toplayip ihtiyaci olan her bloga
# include ediyoruz. Kopyala-yapistir da ayni isi gorurdu, ama bir
# baslik eklendiginde bir yerde unutulurdu - ve unutulan yeri yalnizca
# tarama gosterirdi.

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
