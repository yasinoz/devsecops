# Siparis portalinin TAM duzeltilmis hali.
#
# nginx.guvenli.conf ile tek farki: basliklar bir dosyada toplandi ve
# hem server hem de location bloguna include edildi. Bir add_header
# iceren her blok, ihtiyaci olan butun basliklari kendisi tasimak
# zorunda - nginx'te miras yok.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    include /etc/nginx/guvenlik-basliklari.conf;

    location / {
    }

    location /giris {
        # Bu blok kendi add_header satirlarini tasiyor, bu yuzden ust
        # seviyedekileri kaybediyor. Include ile geri aliyoruz.
        include /etc/nginx/guvenlik-basliklari.conf;

        add_header Set-Cookie "oturum=s3cr3t-oturum-kimligi; Path=/; HttpOnly; Secure; SameSite=Strict";
        add_header Cache-Control "no-store" always;

        default_type text/html;
        return 200 "<html><body><h1>Giris yapildi</h1><a href=\"/\">Ana sayfa</a></body></html>";
    }
}
