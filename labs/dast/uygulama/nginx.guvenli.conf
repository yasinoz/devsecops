# Siparis portalinin "duzeltilmis" hali - ILK DENEME.
#
# DIKKAT: bu dosya bilerek eksik. Gozle bakildiginda dogru gorunuyor,
# kod incelemesinden gecer, statik analiz bir sey demez. Ama taramayi
# tekrar calistirdiginizda bazi bulgular HALA duruyor olacak.
#
# Neden oyle oldugunu labda bulacaksiniz. Tam hali icin solution.tr.md.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # "Server Leaks Version Information" [10036]
    # Varsayilan olarak nginx 'Server: nginx/1.31.7' diyor. Surum bilgisi
    # saldirgana hangi CVE'yi deneyecegini soyluyor.
    server_tokens off;

    # "Missing Anti-clickjacking Header" [10020]
    # Sayfanin baskasinin iframe'ine konmasini engelliyor.
    add_header X-Frame-Options "DENY" always;

    # "X-Content-Type-Options Header Missing" [10021]
    # Tarayicinin icerik turunu kendi tahmin etmesini kapatiyor.
    add_header X-Content-Type-Options "nosniff" always;

    # "Content Security Policy (CSP) Header Not Set" [10038]
    # DIKKAT: 'default-src self' satir ici betigi de engelliyor.
    # index.html icindeki <script> bloku bu basliktan sonra calismiyor -
    # bu bir hata degil, CSP'nin ne demek oldugu. Labda bunu goreceksiniz.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;

    # "Permissions Policy Header Not Set" [10063]
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    # "Cross-Origin-*-Policy Header Missing or Invalid" [90004] [90005]
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    location / {
    }

    location /giris {
        # "Cookie No HttpOnly Flag" [10010] ve
        # "Cookie without SameSite Attribute" [10054]
        #
        # HttpOnly: JavaScript cerezi okuyamiyor, yani XSS ile oturum
        #   calinamiyor.
        # SameSite=Strict: cerez baska siteden gelen isteklerle
        #   gonderilmiyor, CSRF kapaniyor.
        # Secure: yalnizca HTTPS uzerinden gonderiliyor. Lab HTTP
        #   uzerinde kostugu icin ZAP bunu ayrica raporlamiyor - ama
        #   uretimde eksikligi en agir olani budur.
        add_header Set-Cookie "oturum=s3cr3t-oturum-kimligi; Path=/; HttpOnly; Secure; SameSite=Strict";

        # "Storable and Cacheable Content" [10049]
        # Oturum yaniti ara belleklerde durmamali.
        add_header Cache-Control "no-store" always;

        default_type text/html;
        return 200 "<html><body><h1>Giris yapildi</h1><a href=\"/\">Ana sayfa</a></body></html>";
    }
}
