services:  
  java-jre-alpine:
    image: courselabs/java:jre-26.10
    build:
      context: ./java/alpine/jre
      args:
        ALPINE_VERSION: '3.24'
        OPENJDK_VERSION: '25.0.4_p7-r0'

  java-jdk-alpine:
    image: courselabs/java:jdk-26.10
    build:
      context: ./java/alpine/jdk
      args:
        ALPINE_VERSION: '3.24'
        OPENJDK_VERSION: '25.0.4_p7-r0'

  java-jre-debian:
    image: courselabs/java:jre-debian-26.10
    build:
      context: ./java/debian/jre

  java-jdk-debian:
    image: courselabs/java:jdk-debian-26.10
    build:
      context: ./java/debian/jdk
