services:

  node-exporter:
    image: prom/node-exporter:v1.9.1
    networks: 
      - metrics

  fulfilment-api:
    image: courselabs/fulfilment-api:25.03
    ports:
      - 8080:80
    networks: 
      - fulfilment
      - metrics

  fulfilment-processor:
    image: courselabs/fulfilment-processor:25.03
    environment:
      - Observability__Metrics__IncludeRuntime=true
    networks: 
      - fulfilment
      - metrics

networks: 
  fulfilment:
  metrics:
    name: metrics
