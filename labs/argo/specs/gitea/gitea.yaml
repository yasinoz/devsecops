# Kubernetes icinde calisan yerel Git sunucusu.
#
# Upstream burada Gogs kullaniyordu; Gogs fiilen bakimsiz kaldigi icin aktif
# catali Gitea'ya gecildi. Yapilandirma semasi farkli: Gitea tum ayarlari
# GITEA__<bolum>__<ANAHTAR> bicimindeki ortam degiskenleriyle de alabiliyor,
# bu yuzden ayri bir ConfigMap'e gerek kalmiyor.
#
# Depolama bilincli olarak emptyDir: lab bittiginde gitmesi isteniyor.
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: infra
  labels:
    team: infrastructure
spec:
  type: NodePort
  ports:
    - port: 3000
      nodePort: 30300
      targetPort: gitea
  selector:
    app: gitea
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: infra
  labels:
    team: infrastructure
spec:
  selector:
    matchLabels:
      app: gitea
  template:
    metadata:
      labels:
        app: gitea
    spec:
      containers:
        - name: gitea
          image: ghcr.io/yasinoz/gitea/gitea:28.2.0
          env:
            # Kurulum sihirbazini atla - lab ortaminda elle kurulum istemiyoruz
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__database__DB_TYPE
              value: sqlite3
            - name: GITEA__server__ROOT_URL
              # ArgoCD kume ici DNS adiyla erisecek; tarayici NodePort ile
              value: http://gitea.infra.svc.cluster.local:3000/
            - name: GITEA__service__DISABLE_REGISTRATION
              value: "false"
            - name: GITEA__service__REQUIRE_SIGNIN_VIEW
              value: "false"
          ports:
            - name: gitea
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: gitea
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
