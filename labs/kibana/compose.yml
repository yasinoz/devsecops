services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5
    ports: 
      - 9200:9200
    networks:
      - logging

  logstash:
    image: docker.elastic.co/logstash/logstash:9.5.5
    volumes:
      - ./data:/data
      - ./pipelines:/pipelines
      - ./config/pipelines.yml:/usr/share/logstash/config/pipelines.yml
    networks:
      - logging

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5
    ports: 
      - 5601:5601
    networks:
      - logging

networks:
  logging:
    name: logging
