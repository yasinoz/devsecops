input {
  file {
    path => "/data/fulfilment-*.csv"
    mode => "read"
  }
}

filter {
  csv {
      separator => ","
      columns => ["log_timestamp","source","level", "message"]
  }
  
  date {
    match => [ "log_timestamp", "ISO8601" ]
    remove_field => ["log_timestamp"]
  }
}

output {
  elasticsearch {
    hosts    => [ 'elasticsearch' ]

    # Logstash 8'den beri elasticsearch cikisi, 'index' verilmediginde
    # VERI AKISI (data stream) moduna geciyor: kayitlar klasik
    # 'logstash-YYYY.MM.dd' indeksi yerine 'logs-generic-default' akisina
    # gidiyor ve lab'in 'logstash-*' data view'i hicbir sey bulamiyor.
    # Lab klasik indeks isimlendirmesini anlattigi icin kapatiyoruz.
    data_stream => false

    # Indeks adini acikca veriyoruz. Iki sebep:
    #  1) Logstash 9'un ECS varsayilani 'ecs-logstash' adini kullaniyor,
    #     lab ise 'logstash-YYYY.MM.dd' anlatiyor.
    #  2) 'ecs-logstash*' sablonu 'source' alanini NESNE olarak tanimliyor;
    #     CSV'deki 'source' sutunu ise duz metin, bu yuzden her kayit
    #     document_parsing_exception ile reddediliyordu.
    index       => "logstash-%{+YYYY.MM.dd}"
  }
}