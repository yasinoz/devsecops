# NOT: courselabs/fulfilment-* imajlari digest ile pinlendi.
# Docker Hub'da '25.03' diye bir etiket YOK - yalnizca
# '25.03-linux-amd64' var, yani Apple Silicon ogrencilerde cekilemezdi.
# Cok mimarili olan tek surum 'latest'; tekrar edilebilirlik icin onun
# digest'ine sabitlendi (digest hem amd64 hem arm64'u kapsar).
services:

  fulfilment-api:
    image: courselabs/fulfilment-api@sha256:ee65224fb578b2ff909358edb1e488e25dd8fafdac668bba97d26825a9b8278c
    ports:
      - "8071:80"
    environment:
      - OPENTRACING_JAEGER_ENABLED=true
    networks:
      - tracing 
      - fulfilment 

  fulfilment-authz:
    image: courselabs/fulfilment-authz@sha256:d3e7532693ecc22c3d525bb52bc89538121af62b330d2769d9e4848457ef5483
    ports:
      - "8072:80"
    environment:
      - Observability__Trace__Console=false
      - Observability__Trace__Jaeger=true
    networks:
      - tracing 
      - fulfilment 

  fulfilment-web:
    image: courselabs/fulfilment-web@sha256:a5118de1f92688719c37ca6119010f904e38520791e58af447f958da9168700e
    ports:
      - "8070:80"
    environment:
      - Observability__Trace__Console=false
      - Observability__Trace__Jaeger=true
      - Documents__Authz__Url=http://fulfilment-authz/check
    depends_on:
      - fulfilment-api
      - fulfilment-authz
    networks:
      - tracing 
      - fulfilment 

networks:
  fulfilment:
  tracing:
    name: tracing
