# NOT: courselabs/fulfilment-* imajlari digest ile pinlendi.
# Docker Hub'da '25.03' diye bir etiket YOK - yalnizca
# '25.03-linux-amd64' var, yani Apple Silicon ogrencilerde cekilemezdi.
# Cok mimarili olan tek surum 'latest'; tekrar edilebilirlik icin onun
# digest'ine sabitlendi (digest hem amd64 hem arm64'u kapsar).
services:

  fulfilment-api:
    image: ghcr.io/yasinoz/courselabs/fulfilment-api:sha-ee65224fb578
    ports:
      - "8071:80"
    environment:
      - OPENTRACING_JAEGER_ENABLED=true
    networks:
      - tracing 
      - fulfilment 

  fulfilment-authz:
    image: ghcr.io/yasinoz/courselabs/fulfilment-authz:sha-d3e7532693ec
    ports:
      - "8072:80"
    environment:
      - Observability__Trace__Console=false
      - Observability__Trace__Jaeger=true
    networks:
      - tracing 
      - fulfilment 

  fulfilment-web:
    image: ghcr.io/yasinoz/courselabs/fulfilment-web:sha-a5118de1f926
    ports:
      - "8070:80"
    environment:
      - Observability__Trace__Console=false
      - Observability__Trace__Jaeger=true
      - Documents__Authz__Url=http://fulfilment-authz/check
    depends_on:
      - fulfilment-api
      - fulfilment-authz
    networks:
      - tracing 
      - fulfilment 

networks:
  fulfilment:
  tracing:
    name: tracing
