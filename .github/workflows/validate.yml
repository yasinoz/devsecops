name: Lab dogrulama

# Dersi bozan hatalarin repoya sizmasini engeller. Araclar
# yasinoz/labs-platform reposunda tutulur; burada checkout edilir, boylece
# surum matrisi ve kurallar tek yerde yasar.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Lab reposunu al
        uses: actions/checkout@v5

      - name: Platform araclarini al
        uses: actions/checkout@v5
        with:
          repository: yasinoz/labs-platform
          path: .platform

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: manifest.json guncel mi
        run: python .platform/tools/make-manifest.py . --check

      - name: Mekanik sorunlar (compose v1, pinlenmemis/eski imaj)
        run: |
          python .platform/tools/lab-lint.py . \
            --versions .platform/VERSIONS.yaml \
            --only compose,pins,stale

      - name: Kirik baglanti ve frontmatter
        run: |
          python .platform/tools/lab-lint.py . \
            --versions .platform/VERSIONS.yaml \
            --only links,frontmatter

      # Ceviri ilerlemesi: henuz tamamlanmadigi icin basarisizlik saymiyoruz.
      # Tum lablar cevrildiginde '|| true' kaldirilacak.
      - name: Ceviri durumu (bilgilendirme)
        run: |
          python .platform/tools/lab-lint.py . \
            --versions .platform/VERSIONS.yaml \
            --only i18n,parity || true

  compose-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Tum compose dosyalarini dogrula
        run: |
          # 'docker compose config' dosyayi ayristirir ve degiskenleri cozer;
          # sozdizimi hatasi varsa burada yakalanir.
          fail=0
          while IFS= read -r f; do
            if grep -qE '^[[:space:]]*services[[:space:]]*:' "$f"; then
              if ! out=$(docker compose -f "$f" config 2>&1); then
                echo "::error file=$f::compose ayristirma hatasi"
                echo "$out" | head -20
                fail=1
              else
                echo "ok  $f"
              fi
            fi
          done < <(find . -name '*.yml' -o -name '*.yaml' | grep -v '^./.git' | sort)
          exit $fail
